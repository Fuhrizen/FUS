<!doctype html><html lang="en"><meta charset="utf-8"><title>FUS browser regression harness</title>
<link rel="stylesheet" href="/styles/character-sheet.css"><script src="/node_modules/handlebars/dist/handlebars.js"></script>
<style>
body{margin:0;background:#777;color:#eee;font:14px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default}#board{position:fixed;inset:0;background:repeating-linear-gradient(0deg,#777 0 59px,#888 60px)}#ui-right{position:fixed;right:0;top:0;width:320px;height:100vh;background:#222;z-index:10}#rail{position:absolute;left:0;width:40px}#sidebar{position:absolute;right:0;top:0;width:280px;height:100%;overflow:auto}#hotbar{position:fixed;bottom:10px;left:40%;width:240px;height:40px;background:#292929;z-index:10}#token-hud{position:fixed;left:200px;top:250px;width:60px;height:60px;z-index:20}#token-hud .col{position:absolute}#token-hud .right{left:70px}#token-hud button{background:#222;color:#fff}#controls{position:fixed;left:10px;top:10px;z-index:30;display:flex;gap:5px}.token-fixture{position:absolute;top:250px;width:60px;height:60px;border:2px solid #fff;box-sizing:border-box;background:#555}.token-fixture.origin{left:200px}.token-fixture.target{left:420px}#sheet-host{position:fixed;left:10px;top:70px;z-index:25;width:min(850px,calc(100vw - 20px));height:650px;background:#171720;overflow:auto}.fus-sheet{height:100%;box-sizing:border-box}#sheet-host[hidden]{display:none}.window-content{height:calc(100% - 35px);overflow:auto}.window-header{height:35px;background:#16161d}.fus-encounters-window{background:#181820;color:#eee;z-index:30;border:1px solid #888;box-sizing:border-box}.window-header button{float:right}.fus-cover-preview{z-index:5!important}#chat-host{position:fixed;top:400px;left:20px;max-width:340px;background:#e9e5d8;color:#222;z-index:15}
.fus-wizard-window{left:20px!important;top:70px!important;z-index:40;background:#222;max-width:calc(100vw - 40px);max-height:calc(100vh - 90px)}
</style>
<div id="board"><div class="token-fixture origin">Actor</div><div class="token-fixture target">Target</div></div>
<div id="controls"><button id="open-sheet">Sheet</button><button id="target-action">Target</button><button id="toggle-sidebar">Sidebar</button></div>
<div id="token-hud"><div class="col middle"></div><div class="col right"></div></div><div id="ui-right"><div id="rail"><button data-tab="combat">Combat</button></div><div id="sidebar"></div></div><div id="hotbar">Macro bar</div><div id="sheet-host" hidden></div><div id="chat-host"></div>
<script type="module" src="/tests/browser/harness.mjs"></script></html>
