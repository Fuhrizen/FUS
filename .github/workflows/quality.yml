name: Quality checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-node-${{ matrix.node }}
          path: reports/
          retention-days: 7
  package:
    name: Compendium and release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run validate:package
      - uses: actions/upload-artifact@v4
        with:
          name: validated-system-package
          path: dist/
          retention-days: 7
  browser:
    name: Browser regressions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 7
  gate:
    name: CI gate
    if: always()
    needs: [unit, package, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          UNIT: ${{ needs.unit.result }}
          PACKAGE: ${{ needs.package.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$UNIT" = success && test "$PACKAGE" = success && test "$BROWSER" = success
