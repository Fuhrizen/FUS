name: Publish beta release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment: major=X, feature=Y, minor=Z"
        required: true
        default: minor
        type: choice
        options: [major, feature, minor]
  # Each completed collection updates the release request; CI runs only for releases.
  push:
    branches: [main]
    paths: [tools/beta-release-request.json]

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  publish:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require the tested revision to remain current
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Increment release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: node tools/bump-version.mjs
      - name: Install build dependencies
        run: npm ci
      - name: Test and validate
        run: |
          npm test
          npm run check
      - name: Package checked-in runtime and compendiums
        run: npm run build
      - name: Validate release archive
        run: npm run validate:package
      - name: Save release version
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system.json package.json package-lock.json
          git commit -m "Release v$VERSION beta"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish versioned beta and update channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          archive="dist/FUS-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$tag" "$archive" dist/system.json dist/SHA256SUMS --target "$RELEASE_SHA" --title "$tag Beta" --notes-file tools/beta-release-notes.txt --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease --latest=false
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$RELEASE_SHA" --title "FUS Beta Channel" --notes "Install using the system.json asset to receive beta updates." --prerelease --latest=false
          fi
          gh release upload beta dist/system.json --clobber
          gh release edit beta --title "FUS Beta Channel — $tag" --notes "Current beta: $tag. Install using the system.json asset to receive beta updates." --prerelease --latest=false
