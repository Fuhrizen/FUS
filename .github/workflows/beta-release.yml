name: Publish beta release

on:
  workflow_dispatch:
  # Publishing requires an explicit release request; ordinary changes never trigger it.
  push:
    branches: [main]
    paths: [tools/beta-release-request.json]

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate beta version
        id: version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('system.json'));
          if (!/^0\.\d+\.\d+$/.test(m.version)) throw new Error('This workflow only publishes pre-1.0 beta versions');
          if (m.manifest !== 'https://github.com/Fuhrizen/FUS/releases/download/beta/system.json') throw new Error('Use the beta channel manifest');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + m.version + '\n');
          JS
      - name: Install build dependencies
        run: npm ci
      - name: Test and validate
        run: |
          npm test
          npm run check
      - name: Package checked-in runtime and compendiums
        run: npm run build
      - name: Publish versioned beta and update channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          archive="dist/FUS-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$tag" "$archive" dist/system.json --target "$GITHUB_SHA" --title "$tag Beta" --notes-file tools/beta-release-notes.txt --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease --latest=false
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$GITHUB_SHA" --title "FUS Beta Channel" --notes "Install using the system.json asset to receive beta updates." --prerelease --latest=false
          fi
          gh release upload beta dist/system.json --clobber
          gh release edit beta --title "FUS Beta Channel — $tag" --notes "Current beta: $tag. Install using the system.json asset to receive beta updates." --prerelease --latest=false
